<!DOCTYPE html>
<html>
<head>
  <title>Table with Merged Cells</title>
</head>

<body>

<center>
  <font size="5"><b><i>A test table with merged cells</i></b></font>
  <br><br>

  <table border="1" cellpadding="10" cellspacing="0">
    <tr>
      <th rowspan="2"></th>
      <th colspan="2">
        <font size="4"><b>Average</b></font>
      </th>
      <th rowspan="2">
        <font size="4"><b>Red<br>eyes</b></font>
      </th>
    </tr>

    <tr>
      <th><font size="3">height</font></th>
      <th><font size="3">weight</font></th>
    </tr>

    <tr>
      <th><font size="3">Males</font></th>
      <td>1.9</td>
      <td>0.003</td>
      <td>40%</td>
    </tr>

    <tr>
      <th><font size="3">Females</font></th>
      <td>1.7</td>
      <td>0.002</td>
      <td>43%</td>
    </tr>
  </table>
</center>

</body>
</html>
